services:
  neo4j:
    image: neo4j:5-community
    container_name: justinus-api-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-justinus}
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (application driver connections)
    volumes:
      - justinus-api-neo4j-data:/data

volumes:
  justinus-api-neo4j-data:
